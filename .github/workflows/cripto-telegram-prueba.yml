name: Prueba bot Telegram (sin enviar)
# Temporal: solo en la rama telegram-bot, para ver qué fuentes de Binance responden desde GitHub. No usa secretos.
on:
  push:
    branches: [telegram-bot]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          for u in "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1d&limit=2" "https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=2" "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=2" "https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/1d/BTCUSDT-1d-2026-09.zip"; do echo "$(curl -s -o /dev/null -w '%{http_code}' "$u") $u"; done | tee /tmp/probe.txt
          node cripto/tools/telegram.mjs /tmp/state.json
          mkdir /tmp/pub && cd /tmp/pub && cp /tmp/state.json /tmp/probe.txt .
          git init -q -b cripto-bot-prueba && git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -qm prueba
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cripto-bot-prueba
